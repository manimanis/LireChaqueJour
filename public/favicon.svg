<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Deep Royal Indigo to Midnight Navy -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="45%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Sun Glow Gradient -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.5"/>
      <stop offset="55%" stop-color="#f59e0b" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Sun Core Gradient -->
    <linearGradient id="sunGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="45%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>

    <!-- Left Page Gradient -->
    <linearGradient id="leftPage" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="85%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Right Page Gradient -->
    <linearGradient id="rightPage" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="15%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>

    <!-- Book Cover Base Gradient -->
    <linearGradient id="coverGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Golden Bookmark Ribbon Gradient -->
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Soft drop shadow for book pages -->
    <filter id="bookShadow" x="-10%" y="-10%" width="125%" height="135%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- App Icon Squircle Background -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="112" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.12"/>

  <!-- Morning Sun & Daily Dawn (symbolizing "chaque jour") -->
  <!-- Outer halo -->
  <circle cx="256" cy="190" r="145" fill="url(#sunGlow)"/>
  
  <!-- Subtle sunrise rays -->
  <g stroke="#fde047" stroke-width="4" stroke-linecap="round" opacity="0.4">
    <line x1="256" y1="65" x2="256" y2="92"/>
    <line x1="175" y1="98" x2="194" y2="117"/>
    <line x1="337" y1="98" x2="318" y2="117"/>
    <line x1="122" y1="165" x2="148" y2="175"/>
    <line x1="390" y1="165" x2="364" y2="175"/>
  </g>

  <!-- Rising Sun disc -->
  <circle cx="256" cy="190" r="74" fill="url(#sunGrad)"/>

  <!-- Little reading sparkles / stars in the morning sky -->
  <path d="M386,105 Q386,118 399,118 Q386,118 386,131 Q386,118 373,118 Q386,118 386,105 Z" fill="#fde047" opacity="0.75"/>
  <path d="M128,128 Q128,137 137,137 Q128,137 128,146 Q128,137 119,137 Q128,137 128,128 Z" fill="#fde047" opacity="0.6"/>

  <!-- Book Container with soft shadow -->
  <g filter="url(#bookShadow)">
    <!-- Book Cover Spine & Underlay (Thickness) -->
    <path d="M90,366 L90,378 C90,383 95,387 100,386 C155,375 215,380 256,402 C297,380 357,375 412,386 C417,387 422,383 422,378 L422,366 C422,371 417,375 412,374 C357,363 297,368 256,390 C215,368 155,363 100,374 C95,375 90,371 90,366 Z" fill="url(#coverGrad)"/>

    <!-- Left Page Base -->
    <path d="M256,255 C215,234 153,230 98,241 C93,242 89,246 89,252 L89,364 C89,370 94,374 99,373 C153,362 215,367 256,389 Z" fill="url(#leftPage)"/>

    <!-- Right Page Base -->
    <path d="M256,255 C297,234 359,230 414,241 C419,242 423,246 423,252 L423,364 C423,370 418,374 413,373 C359,362 297,367 256,389 Z" fill="url(#rightPage)"/>

    <!-- Center spine crease / shadow -->
    <path d="M253,255 C255,290 255,350 253,389 L259,389 C257,350 257,290 259,255 Z" fill="#64748b" opacity="0.35"/>

    <!-- Left Page Text Lines (Subtle Reading Content) -->
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" opacity="0.6">
      <path d="M125,278 C160,272 195,275 228,284"/>
      <path d="M125,304 C160,298 195,301 228,310"/>
      <path d="M125,330 C160,324 195,327 228,336"/>
    </g>

    <!-- Right Page Text Lines -->
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" opacity="0.6">
      <path d="M284,284 C317,275 352,272 387,278"/>
      <path d="M284,310 C317,301 352,298 387,304"/>
      <path d="M284,336 C317,327 352,324 387,330"/>
    </g>

    <!-- Golden Ribbon Bookmark (Marker for today's daily reading segment) -->
    <path d="M248,255 L264,255 L264,430 L256,418 L248,430 Z" fill="url(#ribbonGrad)"/>
    <path d="M256,255 L264,255 L264,430 L256,418 Z" fill="#000000" opacity="0.12"/>
  </g>
</svg>
